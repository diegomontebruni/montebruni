# Site privado: NADA aqui pode ser indexado, arquivado ou raspado.
# Três camadas: (1) bots conhecidos (buscadores, crawlers de IA, ferramentas de SEO,
# scrapers e clientes de script) recebem 403 pelo User-Agent; (2) todo resposta leva
# X-Robots-Tag proibindo indexação (vale também para arquivos sem <meta>); (3) o
# robots.txt bloqueia tudo e não existe sitemap.
map $http_user_agent $bot_bloqueado {
    default 0;
    "~*(googlebot|adsbot|mediapartners|bingbot|msnbot|slurp|duckduckbot|baiduspider|yandex|sogou|exabot|facebot|facebookexternalhit|twitterbot|linkedinbot|pinterest|applebot|petalbot|seznambot|qwant)" 1;
    "~*(gptbot|chatgpt|oai-searchbot|claudebot|claude-web|anthropic|ccbot|google-extended|bytespider|amazonbot|perplexity|youbot|cohere|diffbot|omgili|timpibot|meta-externalagent|imagesiftbot|ai2bot|mistral)" 1;
    "~*(ahrefs|semrush|mj12bot|dotbot|rogerbot|blexbot|serpstat|dataforseo|screaming frog|sitebulb|netcraft|majestic|seokicks|linkdex|moz\.com)" 1;
    "~*(ia_archiver|archive\.org|wayback|heritrix|nutch|httrack|wget|curl|python|scrapy|go-http-client|java/|libwww|okhttp|axios|node-fetch|undici|httpclient|php/|ruby|perl|crawler|spider|scraper|headless)" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, nocache, noai, noimageai" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    if ($bot_bloqueado) {
        return 403;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~* ^/(sitemap.*\.xml|sitemap.*\.txt|ads\.txt|humans\.txt|security\.txt)$ {
        return 404;
    }

    location = /nginx.conf { return 404; }
    location = /docker-compose.yml { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
